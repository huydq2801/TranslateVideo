<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comicify Video Translator</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div id="app-container">
        <!-- Top Navbar Status & Settings -->
        <header class="header-nav">
            <div class="logo-brand">
                🎬 <span>Comicify</span> <span class="highlight">Translator</span>
            </div>
            
            <div class="header-status">
                <input type="password" id="gemini-key-input" class="input-field" style="width: 220px;" placeholder="Gemini API Key...">
                
                <div id="status-ocr" class="status-badge offline">
                    <span class="dot"></span>
                    <span id="text-ocr">OCR Offline</span>
                </div>
                <div id="status-gemini" class="status-badge offline">
                    <span class="dot"></span>
                    <span id="text-gemini">API Key Missing</span>
                </div>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="main-workspace">
            <!-- Left: Video & Canvas Editor -->
            <section class="video-section">
                <div class="video-container" id="video-container">
                    <video id="video-player" crossorigin="anonymous"></video>
                    <canvas id="overlay-canvas"></canvas>
                </div>

                <!-- Custom Dedicated Video Player Control Bar -->
                <div class="player-control-bar">
                    <button id="btn-play-pause" class="btn btn-sm">▶ Phát</button>
                    <button id="btn-prev-frame" class="btn btn-sm">⏮ -1s</button>
                    <button id="btn-next-frame" class="btn btn-sm">⏭ +1s</button>

                    <input type="range" id="video-seekbar" min="0" max="100" value="0" step="0.01" class="seekbar-input">

                    <span id="time-display" class="time-display-text">00:00.0 / 00:00.0</span>
                    <button id="btn-toggle-mute" class="btn btn-sm">🔊</button>
                </div>

                <div class="video-toolbar">
                    <div class="toolbar-group">
                        <button id="btn-select-video" class="btn btn-primary">📁 Chọn Video</button>
                        <select id="sel-scan-interval" class="input-field" title="Tần suất quét khung hình" style="width: 170px;">
                            <option value="0.15">Rất Tỉ Mỉ (0.15s / 6.7 FPS)</option>
                            <option value="0.20">Tỉ Mỉ (0.20s / 5 FPS)</option>
                            <option value="0.30" selected>Chuẩn (0.30s / 3.3 FPS)</option>
                            <option value="0.50">Nhanh (0.50s / 2 FPS)</option>
                            <option value="1.00">Siêu Nhanh (1.00s / 1 FPS)</option>
                        </select>
                        <button id="btn-start-scan" class="btn btn-emerald" disabled>⚡ Quét Thoại (Full-Frame)</button>
                        <button id="btn-filter-trash" class="btn" disabled>🧹 AI Lọc Rác</button>
                        <button id="btn-analyze-context" class="btn" disabled>🧠 AI Ngữ Cảnh & Xưng Hô</button>
                    </div>

                    <div class="toolbar-group">
                        <button id="btn-translate-all" class="btn btn-primary" disabled>🌐 Dịch AI (Gemini 3.5 Flash Lite)</button>
                        <button id="btn-export-video" class="btn btn-emerald" disabled>💾 Xuất Video MP4</button>
                    </div>
                </div>
            </section>

            <!-- Right: Streamlined Dialogue Sidebar -->
            <section class="sidebar-section">
                <div class="sidebar-header">
                    <div class="sidebar-title">💬 Danh Sách Thoại (<span id="dialogue-count">0</span>)</div>
                    <div class="toolbar-group">
                        <label style="font-size: 0.78rem; color: var(--text-secondary); cursor: pointer;">
                            <input type="checkbox" id="chk-show-trash" style="margin-right: 4px;"> Hiện Đã Xóa
                        </label>
                    </div>
                </div>

                <div id="dialogue-list" class="dialogue-list">
                    <div style="text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 0.88rem;">
                        Chưa có thoại nào.<br>Hãy chọn video và nhấn <b>Quét Thoại</b> để bắt đầu.
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Progress Modal -->
    <div id="progress-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3 id="modal-title" style="font-size: 1rem; font-weight: 700;">Đang xử lý...</h3>
            <div class="progress-bar-track">
                <div id="modal-progress-fill" class="progress-bar-fill"></div>
            </div>
            <div id="modal-status-text" style="font-size: 0.82rem; color: var(--text-secondary); word-break: break-word;">
                Đang chuẩn bị...
            </div>
            <div style="display: flex; justify-content: flex-end;">
                <button id="btn-cancel-modal" class="btn btn-sm">Hủy Bỏ</button>
            </div>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
